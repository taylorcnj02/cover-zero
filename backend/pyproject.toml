[project]
name = "nfl-parlay-backend"
version = "0.1.0"
description = "FastAPI backend for a local NFL data app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pandas",
    "nflreadpy",
    "polars",
    "python-dotenv",
    "xgboost",
    "scikit-learn",
]

[tool.uv]
package = false
